[package]
name = "orb_slam3_rs"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
nalgebra = { version = "0.33.2", features = ["serde-serialize"] }
opencv = "0.98.1"
rand = "0.10.0"
rayon = "1.11.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
serde = { version = "1.0.228", features = ["derive"] }

[build-dependencies]
flate2 = "1.0"
tar = "0.4"
